<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rankings · Nintendo Release Timeline</title>
    <meta name="description" content="Nintendo games released since the Switch 2 launch, ranked by critic score." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e60012'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='3.5'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        const t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <header class="app-header">
      <h1 class="app-title">
        <span class="app-title__site"><span class="app-title__dot"></span><span class="app-title__name">Nintendo Release Timeline</span><span class="app-title__short" aria-hidden="true">NRT</span></span>
      </h1>
      <div></div>
      <div class="app-header__actions">
        <nav class="app-nav" aria-label="Pages">
          <a class="app-nav__link" href="./">Timeline</a>
          <a class="app-nav__link" href="rankings.html" aria-current="page">Rankings</a>
          <a class="app-nav__link" href="studios.html">Studios</a>
        </nav>
        <button class="icon-button theme-toggle" type="button" aria-label="Toggle theme">
          <span class="theme-toggle__icon" aria-hidden="true"></span>
        </button>
      </div>
    </header>

    <main id="app" class="rankings-main" aria-busy="true">
      <p class="app-status">Loading games…</p>
    </main>

    <footer class="app-footer">
      Not affiliated with Nintendo. Scores from OpenCritic, Metacritic and Backloggd.
    </footer>

    <script type="module" src="/src/rankings/main.ts"></script>
  </body>
</html>
