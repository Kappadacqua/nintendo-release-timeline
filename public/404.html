<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found · Nintendo Release Timeline</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e60012'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='3.5'/%3E%3C/svg%3E"
    />
    <style>
      /* Standalone page (GitHub Pages serves it as is): the same colors as tokens.css, written out. */
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --text: #16161a;
        --muted: #6b6b76;
        --accent: #e60012;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0b0d;
          --text: #f3f3f6;
          --muted: #9a9aa6;
          --accent: #cc2433;
        }
      }
      body {
        display: grid;
        place-items: center;
        min-height: 100dvh;
        margin: 0;
        padding: 24px;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--text);
        font: 600 16px/1.5 Nunito, system-ui, sans-serif;
        text-align: center;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 28px;
        font-weight: 900;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
      }
      a {
        display: inline-block;
        padding: 10px 22px;
        border-radius: 999px;
        background: var(--accent);
        color: #ffffff;
        font-weight: 800;
        text-decoration: none;
      }
      a:hover {
        filter: brightness(0.9);
      }
      a:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>This page is not on the timeline.</p>
      <a id="home" href="./">Go to the timeline</a>
    </main>
    <script>
      // On GitHub Pages the site lives under /<repository>/: link to that folder, whatever the wrong path was.
      if (location.hostname.endsWith(".github.io")) {
        document.getElementById("home").href = "/" + location.pathname.split("/")[1] + "/";
      } else {
        document.getElementById("home").href = "/";
      }
    </script>
  </body>
</html>
