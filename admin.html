<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin · Nintendo Release Timeline</title>
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <script>
      try {
        const t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body class="admin">
    <header class="admin-header">
      <h1>Admin <span>· overrides for data/overrides.json</span></h1>
      <p class="admin-header__meta" id="meta"></p>
      <a class="admin-back" href="/">← Timeline</a>
    </header>
    <main class="admin-main">
      <section class="admin-list" aria-label="Games">
        <input class="admin-search" id="search" type="search" placeholder="Search games…" autocomplete="off" />
        <div class="admin-filters" id="filters" role="group" aria-label="Show games missing"></div>
        <p class="admin-count" id="count"></p>
        <ul class="admin-games" id="games"></ul>
      </section>
      <section class="admin-editor" id="editor" aria-live="polite">
        <p class="admin-empty">Pick a game on the left.</p>
      </section>
    </main>
    <script type="module" src="/src/admin/main.ts"></script>
  </body>
</html>
